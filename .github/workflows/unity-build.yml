name: Unity Build

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  build:
    name: Build Unity Project
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Validate Unity secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          echo "UNITY_LICENSE length: ${#UNITY_LICENSE}"
          echo "UNITY_EMAIL length: ${#UNITY_EMAIL}"
          echo "UNITY_PASSWORD length: ${#UNITY_PASSWORD}"
  
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::UNITY_LICENSE is missing or empty"
            exit 1
          fi
  
          if [ -z "$UNITY_EMAIL" ]; then
            echo "::error::UNITY_EMAIL is missing or empty"
            exit 1
          fi
  
          if [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::UNITY_PASSWORD is missing or empty"
            exit 1
          fi
  
          echo "All Unity secrets are configured."

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: StandaloneWindows64
          buildName: SecondWindGames
          buildsPath: Builds
          versioning: Semantic

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecondWindGames-Windows-${{ github.run_number }}
          path: Builds/StandaloneWindows64
          if-no-files-found: error
          retention-days: 14
