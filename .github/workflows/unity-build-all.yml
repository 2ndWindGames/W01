name: Unity Build All

on:
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main
  
  # 매일 오전 9시 (KST / UTC+9)
  schedule:
    - cron: '0 0 * * *'
  
  workflow_dispatch:

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Unity - ${{ matrix.platformName }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    permissions:
      contents: read
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 빌드
          - platformName: Windows
            targetPlatform: StandaloneWindows64
            artifactName: SecondWindGames-Windows
            artifactPath: Builds/StandaloneWindows64
          
          # Android APK 빌드
          - platformName: Android
            targetPlatform: Android
            artifactName: SecondWindGames-Android
            artifactPath: Builds/Android
    
    steps:
      # ------------------------------------------------------------
      # Discord: 빌드 시작
      # ------------------------------------------------------------
      - name: Notify Discord on build start
        continue-on-error: true
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          PLATFORM_NAME: ${{ matrix.platformName }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || 'Manual workflow run' }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ] && [ -z "$DISCORD_WEBHOOK_URL_2" ]; then
            echo "::warning::Discord webhook URLs are missing. Discord notification skipped."
            exit 0
          fi
          
          SHORT_SHA="${COMMIT_SHA:0:7}"
          SHORT_MESSAGE="${COMMIT_MESSAGE:0:500}"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          
          PAYLOAD=$(jq -n \
            --arg platform "$PLATFORM_NAME" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH_NAME" \
            --arg commit "$SHORT_SHA" \
            --arg commitMessage "$SHORT_MESSAGE" \
            --arg actor "$ACTOR" \
            --arg eventName "$EVENT_NAME" \
            --arg runNumber "$RUN_NUMBER" \
            --arg runUrl "$RUN_URL" \
            --arg timestamp "$TIMESTAMP" \
            '{
              username: "SecondWindGames Build",
              embeds: [
                {
                  title: ("🔨 Unity " + $platform + " 빌드 시작"),
                  description: (
                    "SecondWindGames " + $platform
                    + " 빌드를 시작했습니다."
                  ),
                  url: $runUrl,
                  color: 3447003,
                  fields: [
                    {
                      name: "플랫폼",
                      value: $platform,
                      inline: true
                    },
                    {
                      name: "저장소",
                      value: $repository,
                      inline: true
                    },
                    {
                      name: "브랜치",
                      value: $branch,
                      inline: true
                    },
                    {
                      name: "빌드 번호",
                      value: $runNumber,
                      inline: true
                    },
                    {
                      name: "커밋",
                      value: $commit,
                      inline: true
                    },
                    {
                      name: "실행자",
                      value: $actor,
                      inline: true
                    },
                    {
                      name: "실행 유형",
                      value: $eventName,
                      inline: true
                    },
                    {
                      name: "변경 내용",
                      value: $commitMessage,
                      inline: false
                    }
                  ],
                  footer: {
                    text: "SecondWindGames · GitHub Actions"
                  },
                  timestamp: $timestamp
                }
              ],
              components: [
                {
                  type: 1,
                  components: [
                    {
                      type: 2,
                      style: 5,
                      label: "빌드 진행 상황",
                      url: $runUrl
                    }
                  ]
                }
              ]
            }')
          
          for WEBHOOK_URL in "$DISCORD_WEBHOOK_URL" "$DISCORD_WEBHOOK_URL_2"; do
            if [ -n "$WEBHOOK_URL" ]; then
              curl \
                --fail \
                --silent \
                --show-error \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "$WEBHOOK_URL"
            fi
          done
      
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      
      # ------------------------------------------------------------
      # Unity Secret 확인
      # ------------------------------------------------------------
      - name: Validate Unity secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        
        run: |
          echo "UNITY_LICENSE length: ${#UNITY_LICENSE}"
          echo "UNITY_EMAIL length: ${#UNITY_EMAIL}"
          echo "UNITY_PASSWORD length: ${#UNITY_PASSWORD}"
          
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::UNITY_LICENSE is missing or empty"
            exit 1
          fi
          
          if [ -z "$UNITY_EMAIL" ]; then
            echo "::error::UNITY_EMAIL is missing or empty"
            exit 1
          fi
          
          if [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::UNITY_PASSWORD is missing or empty"
            exit 1
          fi
          
          echo "All Unity secrets are configured."
      
      # ------------------------------------------------------------
      # Unity Library 캐시
      # 플랫폼별로 캐시를 분리
      # ------------------------------------------------------------
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          
          key: >-
            Library-${{ runner.os }}-${{ matrix.targetPlatform }}-${{
            hashFiles(
            'Packages/manifest.json',
            'Packages/packages-lock.json',
            'ProjectSettings/ProjectVersion.txt'
            ) }}
          
          restore-keys: |
            Library-${{ runner.os }}-${{ matrix.targetPlatform }}-
            Library-${{ runner.os }}-
      
      # ------------------------------------------------------------
      # Unity Windows 빌드
      # ------------------------------------------------------------
      - name: Build Unity Windows project
        if: matrix.targetPlatform == 'StandaloneWindows64'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        
        with:
          projectPath: .
          targetPlatform: StandaloneWindows64
          buildName: SecondWindGames
          buildsPath: Builds
          versioning: Semantic
      
      # ------------------------------------------------------------
      # Unity Android APK 빌드
      # ------------------------------------------------------------
      - name: Build Unity Android project
        if: matrix.targetPlatform == 'Android'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        
        with:
          projectPath: .
          targetPlatform: Android
          
          # androidPackage: APK
          # androidAppBundle: AAB
          androidExportType: androidPackage
          
          androidVersionCode: ${{ github.run_number }}
          buildName: SecondWindGames
          buildsPath: Builds
          versioning: Semantic
      
      # ------------------------------------------------------------
      # 빌드 결과물 업로드
      # ------------------------------------------------------------
      - name: Upload build artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ matrix.artifactName }}-${{ github.run_number }}
          
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
          retention-days: 14
      
      # ------------------------------------------------------------
      # Discord: 빌드 성공
      # ------------------------------------------------------------
      - name: Notify Discord on success
        if: success()
        continue-on-error: true
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          PLATFORM_NAME: ${{ matrix.platformName }}
          ARTIFACT_URL: ${{ steps.upload-artifact.outputs.artifact-url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ] && [ -z "$DISCORD_WEBHOOK_URL_2" ]; then
            echo "::warning::Discord webhook URLs are missing. Discord notification skipped."
            exit 0
          fi
          
          SHORT_SHA="${COMMIT_SHA:0:7}"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          
          PAYLOAD=$(jq -n \
            --arg platform "$PLATFORM_NAME" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH_NAME" \
            --arg commit "$SHORT_SHA" \
            --arg actor "$ACTOR" \
            --arg runNumber "$RUN_NUMBER" \
            --arg artifactUrl "$ARTIFACT_URL" \
            --arg runUrl "$RUN_URL" \
            --arg timestamp "$TIMESTAMP" \
            '{
              username: "SecondWindGames Build",
              embeds: [
                {
                  title: ("✅ Unity " + $platform + " 빌드 완료"),
                  description: (
                    "SecondWindGames " + $platform
                    + " 빌드가 완료되었습니다."
                  ),
                  url: $artifactUrl,
                  color: 5763719,
                  fields: [
                    {
                      name: "플랫폼",
                      value: $platform,
                      inline: true
                    },
                    {
                      name: "저장소",
                      value: $repository,
                      inline: true
                    },
                    {
                      name: "브랜치",
                      value: $branch,
                      inline: true
                    },
                    {
                      name: "빌드 번호",
                      value: $runNumber,
                      inline: true
                    },
                    {
                      name: "커밋",
                      value: $commit,
                      inline: true
                    },
                    {
                      name: "실행자",
                      value: $actor,
                      inline: true
                    },
                    {
                      name: "보관 기간",
                      value: "14일",
                      inline: true
                    }
                  ],
                  footer: {
                    text: "SecondWindGames · GitHub Actions"
                  },
                  timestamp: $timestamp
                }
              ],
              components: [
                {
                  type: 1,
                  components: [
                    {
                      type: 2,
                      style: 5,
                      label: "빌드 다운로드",
                      url: $artifactUrl
                    },
                    {
                      type: 2,
                      style: 5,
                      label: "Actions 로그",
                      url: $runUrl
                    }
                  ]
                }
              ]
            }')
          
          for WEBHOOK_URL in "$DISCORD_WEBHOOK_URL" "$DISCORD_WEBHOOK_URL_2"; do
            if [ -n "$WEBHOOK_URL" ]; then
              curl \
                --fail \
                --silent \
                --show-error \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "$WEBHOOK_URL"
            fi
          done
      
      # ------------------------------------------------------------
      # Discord: 빌드 실패
      # ------------------------------------------------------------
      - name: Notify Discord on failure
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          PLATFORM_NAME: ${{ matrix.platformName }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ] && [ -z "$DISCORD_WEBHOOK_URL_2" ]; then
            echo "::warning::Discord webhook URLs are missing. Discord notification skipped."
            exit 0
          fi
          
          SHORT_SHA="${COMMIT_SHA:0:7}"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          
          PAYLOAD=$(jq -n \
            --arg platform "$PLATFORM_NAME" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH_NAME" \
            --arg commit "$SHORT_SHA" \
            --arg actor "$ACTOR" \
            --arg runNumber "$RUN_NUMBER" \
            --arg runUrl "$RUN_URL" \
            --arg timestamp "$TIMESTAMP" \
            '{
              username: "SecondWindGames Build",
              embeds: [
                {
                  title: ("❌ Unity " + $platform + " 빌드 실패"),
                  description: (
                    "SecondWindGames " + $platform
                    + " 빌드에 실패했습니다. "
                    + "Actions 로그에서 오류를 확인해주세요."
                  ),
                  url: $runUrl,
                  color: 15548997,
                  fields: [
                    {
                      name: "플랫폼",
                      value: $platform,
                      inline: true
                    },
                    {
                      name: "저장소",
                      value: $repository,
                      inline: true
                    },
                    {
                      name: "브랜치",
                      value: $branch,
                      inline: true
                    },
                    {
                      name: "빌드 번호",
                      value: $runNumber,
                      inline: true
                    },
                    {
                      name: "커밋",
                      value: $commit,
                      inline: true
                    },
                    {
                      name: "실행자",
                      value: $actor,
                      inline: true
                    }
                  ],
                  footer: {
                    text: "SecondWindGames · GitHub Actions"
                  },
                  timestamp: $timestamp
                }
              ],
              components: [
                {
                  type: 1,
                  components: [
                    {
                      type: 2,
                      style: 5,
                      label: "오류 로그 확인",
                      url: $runUrl
                    }
                  ]
                }
              ]
            }')
          
          for WEBHOOK_URL in "$DISCORD_WEBHOOK_URL" "$DISCORD_WEBHOOK_URL_2"; do
            if [ -n "$WEBHOOK_URL" ]; then
              curl \
                --fail \
                --silent \
                --show-error \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "$WEBHOOK_URL"
            fi
          done
  
  